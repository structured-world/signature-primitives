# Existing packages keep OIDC while the first LTV publication uses its own token.
[workspace]
release_always = false
git_release_enable = true

[[package]]
name = "structured-cms"
git_tag_name = "v{{ version }}"

# LTV needs its own first-publication configuration.
[[package]]
name = "structured-ltv"
release = false

# XAdES depends on LTV and follows its first publication.
[[package]]
name = "structured-xades"
release = false

[[package]]
name = "structured-cades"
release = false

[[package]]
name = "structured-pades"
release = false

[[package]]
name = "structured-asic"
release = false

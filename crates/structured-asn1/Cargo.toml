[package]
name = "structured-asn1"
description = "Borrowed BER/DER parsing with shared work budgets and exact byte ranges"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["asn1", "der", "ber", "no-std", "parser"]
categories = ["encoding", "parser-implementations", "no-std"]
include = ["src/**", "tests/**", "benches/**", "Cargo.toml", "README.md", "LICENSE"]

[features]
default = []
std = []
alloc = []
hmac = ["dep:ctutils", "dep:hmac", "dep:sha1", "dep:sha2", "dep:thiserror"]
legacy-hmac = ["hmac", "dep:md-5", "dep:ripemd"]

[dependencies]
ctutils = { version = "0.4", default-features = false, optional = true }
hmac = { version = "0.13", default-features = false, features = ["zeroize"], optional = true }
sha1 = { version = "0.11", default-features = false, features = ["zeroize"], optional = true }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"], optional = true }
md-5 = { version = "0.11", default-features = false, features = ["zeroize"], optional = true }
ripemd = { version = "0.2", default-features = false, features = ["zeroize"], optional = true }
thiserror = { version = "2", default-features = false, optional = true }
# The adapter relies on this Global implementation returning exact Layout size.
allocator-api2 = { version = "0.4.0", default-features = false, features = ["alloc"] }
# hashbrown's published Allocator trait still belongs to the 0.2 API family.
# Both interfaces forward through one account allocator; no second quota model.
allocator-api2-hashbrown = { package = "allocator-api2", version = "0.2.21", default-features = false, features = ["alloc"] }
# The pre-admission bound is audited against this table's control-group layout.
hashbrown = { version = "0.17.1", default-features = false, features = ["default-hasher", "inline-more", "allocator-api2", "raw-entry"] }
# Reuse the existing integer mixer without its implicit entropy initialization.
foldhash = { version = "0.2.0", default-features = false }
# Block/table admission is audited against the resolved allocation-free core.
miniz_oxide = { version = "0.9.1", default-features = false, features = ["block-boundary"] }

[lints]
workspace = true

[[bench]]
name = "seeded_hash"
harness = false
required-features = ["std"]

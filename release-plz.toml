[workspace]
release_always = false
git_release_enable = true
changelog_update = true

[[package]]
name = "structured-asn1"
version_group = "primitives"
changelog_include = ["structured-pkix", "structured-cms", "structured-ltv", "structured-xades"]

[[package]]
name = "structured-pkix"
version_group = "primitives"
changelog_include = ["structured-asn1", "structured-cms", "structured-ltv", "structured-xades"]

[[package]]
name = "structured-cms"
git_tag_name = "v{{ version }}"
version_group = "primitives"
changelog_include = ["structured-asn1", "structured-pkix", "structured-ltv", "structured-xades"]

[[package]]
name = "structured-ltv"
git_tag_name = "structured-ltv-v{{ version }}"
version_group = "primitives"
changelog_include = ["structured-asn1", "structured-pkix", "structured-cms", "structured-xades"]

[[package]]
name = "structured-xades"
git_tag_name = "structured-xades-v{{ version }}"
version_group = "primitives"
changelog_include = ["structured-asn1", "structured-pkix", "structured-cms", "structured-ltv"]

# Initial publication and its trusted publisher are configured separately.
[[package]]
name = "structured-cades"
release = false

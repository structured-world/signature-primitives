name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-pr:
    # Preparing before publication sees a partially updated registry and can
    # turn a version-only merge into another release. The publisher already
    # waits for successful CI on this exact SHA; do not race its completion.
    needs: publish
    if: >-
      github.repository == 'structured-world/signature-primitives' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.publish.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: release-pr
      cancel-in-progress: false
    steps:
      - name: Generate repository-scoped release bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}
      - name: Attach preparation to the published revision
        # release-plz requires a branch (0.3.171 release_pr/mod.rs). Only the
        # disposable checkout's local ref moves; retain the published SHA,
        # even if remote main has advanced while CI/publication was running.
        run: git switch -C main "$GITHUB_SHA"
      - run: rustup toolchain install stable --profile minimal
      - name: Prepare coordinated release PR
        uses: release-plz/action@f393a7b38aca9d9b4c58447b291dbac963901df6 # v0.5.141
        with:
          command: release-pr
          version: 0.3.171
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  publish:
    if: >-
      github.repository == 'structured-world/signature-primitives' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: publish-primitives
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - name: Require successful CI for this exact main commit
        run: python3 .github/scripts/release_ci.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Select first-publication mode
        id: bootstrap
        env:
          XADES_BOOTSTRAP_TOKEN: ${{ secrets.XADES_BOOTSTRAP_TOKEN }}
        run: |
          if [ -n "$XADES_BOOTSTRAP_TOKEN" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish approved coordinated release
        uses: release-plz/action@f393a7b38aca9d9b4c58447b291dbac963901df6 # v0.5.141
        with:
          command: release
          version: 0.3.171
          config: ${{ steps.bootstrap.outputs.enabled == 'true' && '.github/release-core.toml' || 'release-plz.toml' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the first XAdES version
        if: steps.bootstrap.outputs.enabled == 'true'
        uses: release-plz/action@f393a7b38aca9d9b4c58447b291dbac963901df6 # v0.5.141
        with:
          command: release
          version: 0.3.171
          config: .github/release-xades.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.XADES_BOOTSTRAP_TOKEN }}

[package]
name = "structured-pkix"
description = "Borrowed X.509 certificates and provider-neutral certification path validation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["x509", "pkix", "certificates", "no-std"]
categories = ["cryptography", "parser-implementations", "no-std"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE"]

[features]
default = []
std = ["structured-asn1/std"]
alloc = ["structured-asn1/alloc"]

[dependencies]
structured-asn1 = { version = "0.4.2", path = "../structured-asn1", default-features = false }
unicode-normalization = { version = "0.1", default-features = false }
unicode-bidi = { version = "0.3", default-features = false, features = ["hardcoded-data"] }
structured-email-address = { version = "0.0.21", default-features = false, features = ["alloc"] }

[dev-dependencies]
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
# Independent protocol-identity test oracle; production hashing stays injected.
sha1 = { version = "0.11", default-features = false }

[lints]
workspace = true

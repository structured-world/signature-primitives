# The temporary publish-new credential reaches ONLY this new package. Even
# bootstrap requires the approved release commit; feature commits cannot
# publish against older same-version registry dependencies.
[workspace]
release_always = false
git_release_enable = true
git_tag_name = "structured-cades-v{{ version }}"

[[package]]
name = "structured-asn1"
release = false

[[package]]
name = "structured-pkix"
release = false

[[package]]
name = "structured-cms"
release = false

[[package]]
name = "structured-ltv"
release = false

[[package]]
name = "structured-xades"
release = false

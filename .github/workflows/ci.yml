name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Every main push must reach a terminal result: a later push cannot discard
  # validation of the exact commit which approves a release.
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: .github/tests
      - run: npm run check
        working-directory: .github/tests
      - run: python3 -m unittest discover -s .github/tests -p '*_test.py'
      - run: python3 scripts/test-qualify-xades-key.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "--all-features"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Test runner
        run: cargo +stable install cargo-nextest --locked --version 0.9.146
      - name: PDF interoperability tools
        if: matrix.features == '--all-features'
        run: sudo apt-get update && sudo apt-get install --yes qpdf openssl
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --workspace --all-targets ${{ matrix.features }} -- -D warnings
      - run: cargo +stable nextest run --locked --workspace ${{ matrix.features }}
      - run: cargo +stable test --locked --workspace --doc ${{ matrix.features }}
      - run: cargo +stable doc --locked --workspace --no-deps ${{ matrix.features }}
        env:
          RUSTDOCFLAGS: -D warnings

  alloc:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [wasm32-unknown-unknown, thumbv7em-none-eabihf]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - run: cargo +stable check --locked --workspace --no-default-features --features alloc --target ${{ matrix.target }}

  msrv:
    # Preserve the required GitHub check identifier; validate current stable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable check --locked --workspace --all-targets

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal
      - run: bash scripts/check-packages.sh

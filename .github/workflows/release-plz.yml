name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-pr:
    # Preparing before publication sees a partially updated registry and can
    # turn a version-only merge into another release. The publisher already
    # waits for successful CI on this exact SHA; do not race its completion.
    needs: publish
    if: >-
      github.repository == 'structured-world/signature-primitives' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.publish.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: release-pr
      cancel-in-progress: false
    steps:
      - name: Generate repository-scoped release bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}
      - name: Attach preparation to the published revision
        # release-plz requires a branch (0.3.171 release_pr/mod.rs). Only the
        # disposable checkout's local ref moves; retain the published SHA,
        # even if remote main has advanced while CI/publication was running.
        run: git switch -C main "$GITHUB_SHA"
      - run: rustup toolchain install stable --profile minimal
      - name: Prepare coordinated release PR
        uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5.142
        with:
          command: release-pr
          version: 0.3.171
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  publish:
    if: >-
      github.repository == 'structured-world/signature-primitives' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: publish-primitives
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      actions: read
      id-token: write
    outputs:
      released: ${{ steps.release.outputs.releases_created == 'true' || steps.first-ltv.outputs.releases_created == 'true' || steps.dependents.outputs.releases_created == 'true' || steps.first-cades.outputs.releases_created == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - name: Require successful CI for this exact main commit
        run: python3 .github/scripts/release_ci.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Select first-publication mode
        id: bootstrap
        env:
          LTV_BOOTSTRAP_TOKEN: ${{ secrets.LTV_BOOTSTRAP_TOKEN }}
          CADES_BOOTSTRAP_TOKEN: ${{ secrets.CADES_BOOTSTRAP_TOKEN }}
        run: |
          if [ -n "$LTV_BOOTSTRAP_TOKEN" ] && [ -n "$CADES_BOOTSTRAP_TOKEN" ]; then
            echo 'Select only one initial publication in a release run.' >&2
            exit 1
          fi
          if [ -n "$LTV_BOOTSTRAP_TOKEN" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$CADES_BOOTSTRAP_TOKEN" ]; then
            echo 'cades=true' >> "$GITHUB_OUTPUT"
          else
            echo 'cades=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish approved coordinated release
        id: release
        uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5.142
        with:
          command: release
          version: 0.3.171
          config: ${{ steps.bootstrap.outputs.enabled == 'true' && '.github/release-core.toml' || steps.bootstrap.outputs.cades == 'true' && '.github/release-before-cades.toml' || 'release-plz.toml' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the first LTV version
        id: first-ltv
        if: steps.bootstrap.outputs.enabled == 'true'
        uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5.142
        with:
          command: release
          version: 0.3.171
          config: .github/release-ltv.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.LTV_BOOTSTRAP_TOKEN }}
      - name: Wait until LTV resolves for dependents
        if: steps.first-ltv.outputs.releases_created == 'true'
        run: bash scripts/wait-registry-resolution.sh structured-ltv
      - name: Publish packages depending on LTV
        id: dependents
        if: steps.bootstrap.outputs.enabled == 'true'
        uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5.142
        with:
          command: release
          version: 0.3.171
          config: .github/release-dependents.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait until CAdES dependencies resolve
        if: steps.bootstrap.outputs.cades == 'true'
        run: bash scripts/wait-registry-resolution.sh structured-ltv
      - name: Publish the first CAdES version
        id: first-cades
        if: steps.bootstrap.outputs.cades == 'true'
        uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5.142
        with:
          command: release
          version: 0.3.171
          config: .github/release-cades.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CADES_BOOTSTRAP_TOKEN }}

  registry:
    # Qualify what crates.io serves for the version this revision published.
    needs: publish
    if: needs.publish.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown --target thumbv7em-none-eabihf
      - run: rustup toolchain install 1.92.0 --profile minimal
      - name: PDF interoperability tools
        run: sudo apt-get update && sudo apt-get install --yes qpdf openssl
      - name: Test runner
        run: cargo +stable install cargo-nextest --locked --version 0.9.146
      - run: bash scripts/qualify-registry.sh

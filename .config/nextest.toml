[profile.default]
slow-timeout = { period = "30s", terminate-after = 2 }

[[profile.default-miri.overrides]]
# This 448-key collision test performs quadratic probe work under Miri's
# interpreter. Keep the ordinary runtime deadline; allow instrumentation time
# for this concrete allocation/admission regression only.
filter = "test(table_resize_admits_collision_probe_fanout_before_rehashing)"
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.default-miri.overrides]]
# The unchanged workload appends 32,768 scalars and proves linear work/capacity.
# Each iteration uses bounded reserve/copy operations, with no blocking or
# unbounded traversal. Permit interpreter overhead only; native deadline stays.
filter = "test(repeated_scalar_append_has_amortized_growth)"
slow-timeout = { period = "60s", terminate-after = 5 }

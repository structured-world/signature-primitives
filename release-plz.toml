[workspace]
release_always = false
git_release_enable = true
changelog_update = true

[[package]]
name = "structured-asn1"
version_group = "primitives"
changelog_include = ["structured-pkix", "structured-cms", "structured-ltv", "structured-xades", "structured-cades"]

[[package]]
name = "structured-pkix"
version_group = "primitives"
changelog_include = ["structured-asn1", "structured-cms", "structured-ltv", "structured-xades", "structured-cades"]

[[package]]
name = "structured-cms"
git_tag_name = "v{{ version }}"
version_group = "primitives"
changelog_include = ["structured-asn1", "structured-pkix", "structured-ltv", "structured-xades", "structured-cades"]

[[package]]
name = "structured-ltv"
git_tag_name = "structured-ltv-v{{ version }}"
version_group = "primitives"
changelog_include = ["structured-asn1", "structured-pkix", "structured-cms", "structured-xades", "structured-cades"]

[[package]]
name = "structured-xades"
git_tag_name = "structured-xades-v{{ version }}"
version_group = "primitives"
changelog_include = ["structured-asn1", "structured-pkix", "structured-cms", "structured-ltv", "structured-cades"]

[[package]]
name = "structured-cades"
git_tag_name = "structured-cades-v{{ version }}"
version_group = "primitives"
changelog_include = ["structured-asn1", "structured-pkix", "structured-cms", "structured-ltv", "structured-xades"]

[[package]]
name = "structured-pades"
# Initial publication requires the crate's own publisher registration.
release = false

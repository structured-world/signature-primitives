[package]
name = "structured-dstu4145"
description = "Bounded DSTU 4145 verification and Ukrainian streaming hashes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["dstu4145", "kupyna", "gost", "cryptography", "no-std"]
categories = ["cryptography", "no-std"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE", "NOTICE"]

[features]
default = []
alloc = ["structured-asn1/alloc", "structured-pkix/alloc"]
std = ["structured-asn1/std", "structured-pkix/std"]
allocation-tests = ["std", "dep:allocation-counter"]

[dependencies]
structured-asn1 = { version = "0.17.1", path = "../structured-asn1", default-features = false }
structured-pkix = { version = "0.17.1", path = "../structured-pkix", default-features = false }
kupyna = { version = "=0.1.0", default-features = false }
crypto-bigint = { version = "=0.7.10", default-features = false }
rand_core = { version = "=0.10.1", default-features = false }
allocation-counter = { version = "=0.8.1", optional = true }

[dev-dependencies]
gost94 = { version = "=0.11.0", default-features = false }

[lints]
workspace = true

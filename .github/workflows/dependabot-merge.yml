name: Dependabot merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    # A main push leaves open updates behind; a PR run finishing makes one mergeable.
    workflows: [ci, Release]
    types: [completed]
  schedule:
    # Backstop for an event GitHub did not deliver.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-merge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.repository == 'structured-world/signature-primitives' &&
      (github.event_name != 'pull_request_target' ||
       (github.event.pull_request.user.login == 'dependabot[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default-branch automation only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Inspect required checks, base freshness and contracts
        id: inspect
        run: python3 .github/scripts/dependabot_merge.py --dry-run --github-output
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate repository-scoped merge token
        if: steps.inspect.outputs.action_count != '0'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Revalidate planned heads, then request rebase or merge
        if: steps.inspect.outputs.action_count != '0'
        run: python3 .github/scripts/dependabot_merge.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_TOKEN: ${{ steps.app-token.outputs.token }}
          MERGE_PLAN: ${{ steps.inspect.outputs.plan }}
          MERGE_BOT: ${{ steps.app-token.outputs.app-slug }}[bot]

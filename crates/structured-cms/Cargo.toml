[package]
name = "structured-cms"
description = "Borrowed CMS signatures, digital envelopes and timestamps with explicit providers and resource accounting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["cms", "pkcs7", "signature", "no-std"]
categories = ["cryptography", "parser-implementations", "no-std"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE"]

[features]
default = []
std = ["structured-asn1/std", "structured-pkix/std"]
alloc = ["structured-asn1/alloc", "structured-pkix/alloc"]
hmac = ["dep:ctutils", "dep:hmac", "dep:sha1", "dep:sha2", "dep:thiserror"]
legacy-hmac = ["hmac", "dep:md-5", "dep:ripemd"]
password-protection = ["hmac", "dep:aes", "dep:cbc", "dep:des"]
openssl = [
    "dep:aes", "dep:cbc", "dep:crypto-bigint", "dep:der", "dep:des",
    "dep:md-5", "dep:p256", "dep:p384", "dep:p521", "dep:pkcs8", "dep:sec1",
    "dep:thiserror",
]

[dependencies]
structured-asn1 = { version = "0.22.2", path = "../structured-asn1", default-features = false }
structured-pkix = { version = "0.22.2", path = "../structured-pkix", default-features = false }
zeroize = { version = "1.9.1", default-features = false }
ctutils = { version = "0.4", default-features = false, optional = true }
hmac = { version = "0.13", default-features = false, features = ["zeroize"], optional = true }
sha1 = { version = "0.11", default-features = false, features = ["zeroize"], optional = true }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"], optional = true }
md-5 = { version = "0.11", default-features = false, features = ["zeroize"], optional = true }
ripemd = { version = "0.2", default-features = false, features = ["zeroize"], optional = true }
thiserror = { version = "2", default-features = false, optional = true }
aes = { version = "0.9", default-features = false, features = ["zeroize"], optional = true }
cbc = { version = "0.2", default-features = false, features = ["zeroize"], optional = true }
crypto-bigint = { version = "0.7", default-features = false, features = ["zeroize"], optional = true }
der = { version = "0.8", default-features = false, features = ["derive", "oid"], optional = true }
des = { version = "0.9", default-features = false, features = ["zeroize"], optional = true }
p256 = { version = "0.14", default-features = false, features = ["arithmetic"], optional = true }
p384 = { version = "0.14", default-features = false, features = ["arithmetic"], optional = true }
p521 = { version = "0.14", default-features = false, features = ["arithmetic"], optional = true }
pkcs8 = { version = "0.11", default-features = false, optional = true }
sec1 = { version = "0.8", default-features = false, features = ["der"], optional = true }

[dev-dependencies]
der = { version = "0.8", default-features = false, features = ["alloc"] }
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }
# Independent public-vector oracle/adapter only; no engine in the runtime API.
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast"] }
sha2 = { version = "0.11.1", default-features = false }
sha3 = { version = "0.12.0", default-features = false }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
aes = { version = "0.9.4", default-features = false }
cbc = { version = "0.2.1", default-features = false, features = ["block-padding"] }
aes-kw = { version = "0.3.1", default-features = false }
hmac = { version = "0.13.0", default-features = false }
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }

[lints]
workspace = true

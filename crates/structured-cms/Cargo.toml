[package]
name = "structured-cms"
description = "Borrowed CMS SignedData processing with explicit providers and resource accounting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["cms", "pkcs7", "signature", "no-std"]
categories = ["cryptography", "parser-implementations", "no-std"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[features]
default = []
std = ["structured-asn1/std", "structured-pkix/std"]
alloc = ["structured-asn1/alloc", "structured-pkix/alloc"]

[dependencies]
structured-asn1 = { version = "0.2.1", path = "../structured-asn1", default-features = false }
structured-pkix = { version = "0.2.1", path = "../structured-pkix", default-features = false }

[dev-dependencies]
# Independent public-vector oracle/adapter only; no engine in the runtime API.
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast"] }
sha2 = { version = "=0.11.1", default-features = false }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa"] }

[lints]
workspace = true

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    # Reuse the same checks as PRs, on this push/dispatch's exact source SHA.
    # Native needs avoids polling while keeping the OIDC-compatible trigger.
    uses: ./.github/workflows/ci.yml

  release-pr:
    # Preparing before publication sees a partially updated registry and can
    # turn a version-only merge into another release. Native dependencies bind
    # validation, publication and preparation to the same source revision.
    needs: publish
    if: >-
      github.repository == 'structured-world/signature-primitives' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.publish.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: release-pr
      cancel-in-progress: false
    steps:
      - name: Generate repository-scoped release bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}
      - name: Attach preparation to the published revision
        # release-plz requires a branch (0.3.171 release_pr/mod.rs). Only the
        # disposable checkout's local ref moves; retain the published SHA,
        # even if remote main has advanced while CI/publication was running.
        run: git switch -C main "$GITHUB_SHA"
      - run: rustup toolchain install stable --profile minimal
      - name: Prepare coordinated release PR
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release-pr
          version: 0.3.171
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  publish:
    needs: validation
    if: >-
      needs.validation.result == 'success' &&
      github.repository == 'structured-world/signature-primitives' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: publish-primitives
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    outputs:
      released: ${{ steps.release.outputs.releases_created == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - name: Publish approved coordinated release
        id: release
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release
          version: 0.3.171
          config: release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  registry:
    # Qualify what crates.io serves for the version this revision published.
    needs: publish
    if: needs.publish.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown --target thumbv7em-none-eabihf
      - name: PDF interoperability tools
        run: sudo apt-get update && sudo apt-get install --yes qpdf openssl
      - name: Test runner
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-nextest@0.9.146
          fallback: none
      - run: bash scripts/qualify-registry.sh

[workspace]
resolver = "3"
members = ["crates/structured-asn1", "crates/structured-pkix", "crates/structured-cms", "crates/structured-ltv", "crates/structured-xades", "crates/structured-cades", "crates/structured-pades", "crates/structured-asic"]

[workspace.package]
version = "0.16.1"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/structured-world/signature-primitives"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

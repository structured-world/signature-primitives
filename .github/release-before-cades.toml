# Existing packages keep OIDC before the new CAdES crate's first publication.
[workspace]
release_always = false
git_release_enable = true

[[package]]
name = "structured-cms"
git_tag_name = "v{{ version }}"

[[package]]
name = "structured-ltv"
git_tag_name = "structured-ltv-v{{ version }}"

[[package]]
name = "structured-xades"
git_tag_name = "structured-xades-v{{ version }}"

[[package]]
name = "structured-cades"
release = false

[[package]]
name = "structured-pades"
release = false

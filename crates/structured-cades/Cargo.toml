[package]
name = "structured-cades"
description = "Source-bound CAdES baseline composition over CMS and long-term validation facts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["cades", "cms", "signature", "timestamp", "no-std"]
categories = ["cryptography", "no-std"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE"]

[features]
default = []
std = ["structured-asn1/std", "structured-pkix/std", "structured-cms/std", "structured-ltv/std"]
alloc = ["structured-asn1/alloc", "structured-pkix/alloc", "structured-cms/alloc", "structured-ltv/alloc"]

[dependencies]
structured-asn1 = { version = "0.17.1", path = "../structured-asn1", default-features = false }
structured-pkix = { version = "0.17.1", path = "../structured-pkix", default-features = false }
structured-cms = { version = "0.17.1", path = "../structured-cms", default-features = false }
structured-ltv = { version = "0.17.1", path = "../structured-ltv", default-features = false }

[dev-dependencies]
# Independent fixed-curve integration oracle, never a runtime dependency.
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa"] }
sha2 = { version = "=0.11.1", default-features = false }

[lints]
workspace = true
